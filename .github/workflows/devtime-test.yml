name: 'ReleaseFS_Open_Edge'
on:
  workflow_dispatch:
    inputs:
        key:
          type: string
          default: ''
        runner:
          required: true
          type: choice
          options:
            - ubuntu-latest
            - ubuntu-slim
          default: ubuntu-latest
        autobuild-package:
            type: boolean
            default: false
        screenshot:
            type: boolean
            default: false
        tmate-followup:
            type: boolean
            default: false

run-name: ReleaseFS_Open Edge ${{ inputs.runner }}

defaults:
  run:
    shell: bash

env:
  TZ: America/New_York
  CACHE_ID: ubuntu-latest-${{ inputs.key }}
  node: /usr/local/bin/node
  _actions: /home/runner/work/_actions

permissions:
  actions: write

jobs:
  debug:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: ensure actions/upload-artifact
        uses: actions/upload-artifact@v4
        if: false
      - name: ensure actions/cache
        uses: actions/cache@v4
        if: false

      - name: Output Inputs
        shell: bash
        run: |
          cat <<'EOF' | jq -c . | tee inputs.json
          ${{ toJSON(github.event.inputs) }}
          EOF

      - name: 'Checkout p373r-vrmod and ../tpv-gha-nunja workspace'
        shell: bash
        run: |
          git clone --no-progress --quiet --filter=tree:0 --single-branch \
            https://github.com/humbletim/p373r-vrmod \
            --branch ${GITHUB_REF_NAME} p373r-vrmod \
          2>&1 | sed -E '/^(remote:|Receive|Resolve)/d'
          git clone https://github.com/humbletim/firestorm-gha ../tpv-gha-nunja --single-branch --no-progress
          ln -s ../tpv-gha-nunja/gha-node20-run

      - name: preflight check
        uses: ./gha-node20-run
        with:
          environment: DEBUG=true
          run: echo "hi from within node-20-run!"

      # memorialize the fstuple input for posterity; annotations seem survive longer (ie: > 6 months) than step summaries or raw logs
      - name: annotation
        shell: bash
        run: |
          echo "::notice title=inputs::$(jq -c . inputs.json)"
          echo "::notice title=mini-report::$(for id in `ls -1d p373r-vrmod 2>/dev/null` ; do
            echo -n "$(basename $id)=$(git -C $id rev-parse --short HEAD),$(git -C $id rev-list --count HEAD),$(git -C $id describe --all --always | sed 's@heads/@@'); "
          done)"

      - name: 'misc'
        shell: bash
        run: |
          which file 2>/dev/null || ./p373r-vrmod/experiments/portables/setup-ubuntu-build-deps.bash
          mkdir -pv bin
          wget -q -nv https://github.com/bronze1man/yaml2json/releases/download/v1.3.5/yaml2json_linux_amd64 -O bin/yaml2json \
            && chmod a+x bin/yaml2json

      - name: 'LLVM 19'
        shell: bash
        run: |
          which clang++19 2>/dev/null || ./p373r-vrmod/experiments/portables/portable-clang++.bash
          ln -vsTf /usr/lib/llvm-19 llvm

      - name: CACHED-winsdk
        uses: ./gha-node20-run
        with:
          run: |
            set -Euo pipefail
            source ../tpv-gha-nunja/gha/gha.cachette.bash

            gha-cache-restore-fast "$CACHE_ID-winsdk" "$(echo "winsdk" | tr ' ' '\n')" || (
              ./p373r-vrmod/experiments/portables/portable-winsdk.bash || exit 178
              gha-cache-save-fast "$CACHE_ID-winsdk" "$(echo "winsdk" | tr ' ' '\n')" || exit 179 
            )

      - name: CACHED-fs-open-devtime
        uses: ./gha-node20-run
        with:
          run: |
            set -Euo pipefail
            source ../tpv-gha-nunja/gha/gha.cachette.bash

            gha-cache-restore-fast "$CACHE_ID--artifact" "$(echo "fs-open" | tr ' ' '\n')" || (
              wget -nv https://github.com/humbletim/firestorm-gha/releases/download/v7.2.3-vr-alpha-0/fs-open-80036-afc53db-afc53db-devtime.zip \
                && unzip -q fs-open-80036-afc53db-afc53db-devtime.zip \
                || exit 178
              gha-cache-save-fast "$CACHE_ID--artifact" "$(echo "fs-open" | tr ' ' '\n')" || exit 179 
            )

      - name: '  edge-compile new viewer exe'
        shell: bash
        run: |
          cd ./p373r-vrmod/community
          ../experiments/tpvm.sh init ../../fs-open
          ../experiments/tpvm.sh patch llviewerdisplay.cpp
          ../experiments/tpvm.sh mod lldir_win32.cpp
          make fs-open.exe -j

      - name: '/UPLOAD viewer .exe'
        uses: ./gha-node20-run
        with:
          run: |
            set -Euo pipefail
            source ../tpv-gha-nunja/gha/gha.upload-artifact.bash
            gha-upload-artifact-fast \
              fs-${{ inputs.key }}-community-vrmod-exe \
              p373r-vrmod/community/fs-open.exe || exit 150

      - name: '3p-community-vrmod autobuild-package'
        uses: ./gha-node20-run
        if: inputs.autobuild-package
        with:
          run: |
            set -Euo pipefail
            source ../tpv-gha-nunja/gha/gha.upload-artifact.bash
            cd ./p373r-vrmod/community
            bash -c '. 3p-community-vrmod/improvise.bash ; provision_community_vrmod $PWD'
            gha-upload-artifact-fast \
              fs-${{ inputs.key }}-3p-community-vrmod-autobuild-package \
              p373r-vrmod/community/community-vrmod-*.tar.* || exit 150

      - name: CACHED-official-runtime
        uses: ./gha-node20-run
        if: inputs.screenshot
        with:
          run: |
            set -Euo pipefail
            source ../tpv-gha-nunja/gha/gha.cachette.bash

            gha-cache-restore-fast "$CACHE_ID-runtime" "$(echo "official" | tr ' ' '\n')" || (
              wget -nv https://downloads.firestormviewer.org/release/windows/Phoenix-FirestormOS-Releasex64_AVX2-7-2-3-80036_Setup.exe \
                && 7z -bd -bb0 -oofficial x Phoenix-FirestormOS-Releasex64_AVX2-7-2-3-80036_Setup.exe \
                || exit 178
              gha-cache-save-fast "$CACHE_ID-runtime" "$(echo "official" | tr ' ' '\n')" || exit 179
            )
            ln -vsTf official fs-open/runtime

      - name: Setup no-frills tmate session
        if: failure() || inputs.tmate-followup
        uses: ./gha-node20-run
        with:
          run: ./p373r-vrmod/.github/nofrills-tmate/action.bash

      - name: Setup fallback tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
